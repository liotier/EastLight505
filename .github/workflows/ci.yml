name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install libsndfile (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Extract device dump fixtures
        # Python's tarfile module instead of shell tar: avoids Git Bash's
        # path translation on Windows runners (RUNNER_TEMP is a native
        # Windows path; mixing it into a bash-interpolated string for
        # `tar -C` is exactly the kind of thing that works on 9 out of 10
        # runners and silently breaks on the 10th).
        run: |
          python -c "
          import os, tarfile
          dest = os.path.join(os.environ['RUNNER_TEMP'], 'rc505-dump')
          os.makedirs(dest, exist_ok=True)
          with tarfile.open('rc0-files.tar.gz') as tf:
              tf.extractall(dest, filter='data')
          "
      - name: Test
        env:
          EASTLIGHT_DUMP_DIR: ${{ runner.temp }}/rc505-dump
        run: pytest --tb=short -q

  gui:
    name: GUI tests (PyQt6)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsndfile1 \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Install dependencies
        run: pip install -e ".[dev,gui]"
      - name: Verify PyQt6 imports (fail loudly, don't silently skip)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import PyQt6.QtWidgets; print('PyQt6 import OK')"
      - name: Test GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_gui.py --tb=short -q
