name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install libsndfile
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Extract device dump fixtures
        run: |
          mkdir -p "${RUNNER_TEMP}/rc505-dump"
          tar -xzf rc0-files.tar.gz -C "${RUNNER_TEMP}/rc505-dump"
      - name: Test
        env:
          EASTLIGHT_DUMP_DIR: ${{ runner.temp }}/rc505-dump
        run: pytest --tb=short -q
      - name: Verify release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG%%-*}"
          PKG="$(python -c 'import eastlight; print(eastlight.__version__)')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag '${GITHUB_REF_NAME}' (version '$TAG') does not match package version '$PKG'"
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
