site_name: EastLight
site_description: Open-source editor/librarian for the Roland RC-505 MK2
site_url: https://liotier.github.io/EastLightRC-505mk2Librarian/
repo_url: https://github.com/liotier/EastLightRC-505mk2Librarian
repo_name: liotier/EastLightRC-505mk2Librarian

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Install: install.md
  - Getting started: getting-started.md
  - Command reference: commands.md
  - Effects reference: effects.md
  - Schema coverage: schema.md
  - Development: development.md
